<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorkStream Gallery</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#2A2438;
    background:radial-gradient(760px 520px at 12% 6%,rgba(61,219,185,.22),rgba(255,248,240,0) 62%),
      radial-gradient(820px 560px at 92% 14%,rgba(255,138,107,.2),rgba(255,248,240,0) 64%),
      linear-gradient(180deg,#FFFBF6,#FFF4E8);padding:9vw 6vw}
  .kicker{font-size:13px;letter-spacing:.34em;color:#0F9E86;font-weight:800}
  h1{margin-top:18px;font-size:min(64px,10vw);font-weight:900;letter-spacing:.02em;line-height:1.08}
  p.lead{margin-top:16px;max-width:44ch;font-size:17px;line-height:1.8;color:#5A5468}
  .grid{margin-top:44px;display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));max-width:1100px}
  a.card{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid #EFE4D6;border-radius:22px;
    padding:26px 26px 22px;box-shadow:0 22px 60px rgba(96,70,44,.14);transition:.18s}
  a.card:hover{transform:translateY(-3px);box-shadow:0 30px 70px rgba(96,70,44,.2)}
  .tag{display:inline-block;font-size:12px;letter-spacing:.18em;color:#0F9E86;font-weight:800}
  .card b{display:block;margin-top:10px;font-size:24px}
  .card span{display:block;margin-top:8px;font-size:14px;line-height:1.7;color:#6B6474}
  footer{margin-top:56px;font-size:13px;color:#8C8477}
  footer a{color:#0F9E86;text-decoration:none}
</style>
</head>
<body>
  <div class="kicker">WORKSTREAM GALLERY</div>
  <h1>一个人做出来的<br>小东西们</h1>
  <p class="lead">Each of these was made in a WorkStream group by one human and a few virtual employees —
    then thrown here because it turned out playable.</p>
  <div class="grid">
    <a class="card" href="./deep-sea-diner/">
      <span class="tag">GAL · 三幕</span>
      <b>《深海食堂》序章</b>
      <span>六个选项，一条好感度，隐藏结局要踩满 60。<br>策划、台词、立绘、数值，都出自群里的员工。</span>
    </a>
  </div>
  <footer>Built on <a href="https://github.com/void-universe/WorkStream">WorkStream</a> · MIT</footer>
</body>
</html>
